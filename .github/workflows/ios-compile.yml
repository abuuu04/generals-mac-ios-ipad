
name: Compile Generals for iPhone

on:
  workflow_dispatch:

jobs:
  compile:
    runs-on: macos-latest
    timeout-minutes: 180

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install tools
        run: |
          set -e
          brew install cmake ninja meson pkgconf xcodegen glslang

          echo "Checking glslangValidator..."
          command -v glslangValidator
          glslangValidator --version

      - name: Install vcpkg
        run: |
          set -e
          git clone https://github.com/microsoft/vcpkg.git "$HOME/vcpkg"
          "$HOME/vcpkg/bootstrap-vcpkg.sh"
          echo "VCPKG_ROOT=$HOME/vcpkg" >> "$GITHUB_ENV"

      - name: Prepare iOS resources
        run: |
          set -e
          bash scripts/build/ios/fetch-moltenvk.sh
          bash scripts/build/ios/stage-fonts.sh

      - name: Configure Vulkan SDK
        run: |
          set -euo pipefail

          MVK="$HOME/GeneralsX/MoltenVK/MoltenVK/MoltenVK"
          echo "VULKAN_SDK=$MVK" >> "$GITHUB_ENV"

          echo "Searching for static MoltenVK..."
          find "$MVK" -name "libMoltenVK.a" -print

          STATIC_LIB=$(find "$MVK" -type f \
            -name "libMoltenVK.a" -print -quit)

          if [ -z "$STATIC_LIB" ]; then
            echo "::error::Static libMoltenVK.a not found"
            exit 1
          fi

          TARGET="$MVK/lib/MoltenVK.xcframework/ios-arm64"
          mkdir -p "$TARGET"

          if [ "$STATIC_LIB" != "$TARGET/libMoltenVK.a" ]; then
            cp "$STATIC_LIB" "$TARGET/libMoltenVK.a"
          fi

          test -s "$TARGET/libMoltenVK.a"
          echo "Static MoltenVK is ready."

      - name: Configure iOS build
        run: |
          set -e
          cmake --preset ios-vulkan

      - name: Verify build dependencies
        run: |
          set -e
          echo "Checking required build tools..."
          command -v cmake
          command -v ninja
          command -v meson
          command -v glslangValidator
          command -v clang

      - name: Compile engine
        run: |
          set -e
          cmake --build build/ios-vulkan \
            --target z_generals --parallel 3

      - name: Save compiled files
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: generals-ios-engine
          path: build/ios-vulkan/GeneralsMD/
          if-no-files-found: error
          retention-days: 7
