
name: Compile Generals for iPhone

on:
  workflow_dispatch:

jobs:
  compile:
    runs-on: macos-latest
    timeout-minutes: 180

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install tools
        run: |
          set -e
          brew install cmake ninja meson pkgconf xcodegen glslang

          command -v glslangValidator
          glslangValidator --version

      - name: Install vcpkg
        run: |
          set -e
          git clone https://github.com/microsoft/vcpkg.git "$HOME/vcpkg"
          "$HOME/vcpkg/bootstrap-vcpkg.sh"
          echo "VCPKG_ROOT=$HOME/vcpkg" >> "$GITHUB_ENV"

      - name: Prepare iOS resources
        run: |
          set -e
          bash scripts/build/ios/fetch-moltenvk.sh
          bash scripts/build/ios/stage-fonts.sh

      - name: Configure Vulkan SDK
        run: |
          set -euo pipefail

          MVK="$HOME/GeneralsX/MoltenVK/MoltenVK/MoltenVK"
          echo "VULKAN_SDK=$MVK" >> "$GITHUB_ENV"

          STATIC_LIB=$(find "$MVK" -type f \
            -name "libMoltenVK.a" -print -quit)

          if [ -z "$STATIC_LIB" ]; then
            echo "::error::Static MoltenVK not found"
            exit 1
          fi

          TARGET="$MVK/lib/MoltenVK.xcframework/ios-arm64"
          mkdir -p "$TARGET"

          if [ "$STATIC_LIB" != "$TARGET/libMoltenVK.a" ]; then
            cp "$STATIC_LIB" "$TARGET/libMoltenVK.a"
          fi

          test -s "$TARGET/libMoltenVK.a"
          echo "Static MoltenVK ready"

      - name: Configure iOS build
        run: |
          set -e
          cmake --preset ios-vulkan

      - name: Verify build dependencies
        run: |
          set -e
          command -v cmake
          command -v ninja
          command -v meson
          command -v glslangValidator
          command -v clang

      - name: Compile engine
        run: |
          set -e
          cmake --build build/ios-vulkan \
            --target z_generals --parallel 3

      - name: Package iOS libraries and IPA
        run: |
          set -euo pipefail

          BUILD="build/ios-vulkan"
          APP="$BUILD/GeneralsMD/GeneralsXZH.app"
          DEST="output/Payload/GeneralsXZH.app"

          echo "Checking application..."
          test -d "$APP" || {
            echo "::error::GeneralsXZH.app not found"
            find "$BUILD" -name "*.app" -print
            exit 1
          }

          mkdir -p output/Payload
          cp -R "$APP" "$DEST"
          mkdir -p "$DEST/Frameworks"

          echo "Finding SDL libraries..."

          find "$BUILD" -type f \
            \( -name "libSDL3*.dylib" \
            -o -name "libopenal*.dylib" \
            -o -name "libdxvk*.dylib" \) \
            -print

          copy_library() {
            local pattern="$1"
            local file

            file=$(find "$BUILD" -type f \
              -name "$pattern" -print -quit)

            if [ -z "$file" ]; then
              echo "::warning::Library not found: $pattern"
              return 0
            fi

            echo "Copying $file"
            cp -L "$file" "$DEST/Frameworks/"
          }

          copy_library "libSDL3.0.dylib"
          copy_library "libSDL3_image.0.dylib"
          copy_library "libopenal*.dylib"
          copy_library "libdxvk*.dylib"

          echo "Checking critical SDL image library..."

          if [ ! -f "$DEST/Frameworks/libSDL3_image.0.dylib" ]; then
            echo "::error::libSDL3_image.0.dylib missing"
            exit 1
          fi

          echo "Fixing library paths..."

          install_name_tool -add_rpath \
            "@executable_path/Frameworks" \
            "$DEST/GeneralsXZH" || true

          for dylib in "$DEST/Frameworks/"*.dylib; do
            [ -f "$dylib" ] || continue

            name=$(basename "$dylib")

            install_name_tool -id \
              "@rpath/$name" "$dylib" || true
          done

          echo "Fixing executable dependencies..."

          otool -L "$DEST/GeneralsXZH"

          while IFS= read -r dependency; do
            name=$(basename "$dependency")

            if [ -f "$DEST/Frameworks/$name" ]; then
              install_name_tool -change \
                "$dependency" \
                "@rpath/$name" \
                "$DEST/GeneralsXZH"
            fi
          done < <(
            otool -L "$DEST/GeneralsXZH" |
            awk 'NR>1 {print $1}'
          )

          echo "Checking packaged dependencies..."

          otool -L "$DEST/GeneralsXZH"

          echo "Creating unsigned IPA..."

          cd output
          /usr/bin/zip -qry GeneralsXZH.ipa Payload

          test -s GeneralsXZH.ipa
          ls -lh GeneralsXZH.ipa

          echo "IPA packaging completed"

      - name: Upload iPhone IPA
        uses: actions/upload-artifact@v4
        with:
          name: GeneralsXZH-iPhone-IPA
          path: output/GeneralsXZH.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Save compiled files
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: generals-ios-engine
          path: build/ios-vulkan/GeneralsMD/
          if-no-files-found: error
          retention-days: 7
