
name: Compile Generals for iPhone

on:
  workflow_dispatch:

jobs:
  compile:
    runs-on: macos-latest
    timeout-minutes: 180

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install tools
        run: |
          set -e
          brew install cmake ninja meson pkgconf xcodegen glslang
          command -v glslangValidator
          glslangValidator --version

      - name: Install vcpkg
        run: |
          set -e
          git clone https://github.com/microsoft/vcpkg.git "$HOME/vcpkg"
          "$HOME/vcpkg/bootstrap-vcpkg.sh"
          echo "VCPKG_ROOT=$HOME/vcpkg" >> "$GITHUB_ENV"

      - name: Prepare iOS resources
        run: |
          set -e
          bash scripts/build/ios/fetch-moltenvk.sh
          bash scripts/build/ios/stage-fonts.sh

      - name: Configure Vulkan SDK
        run: |
          set -euo pipefail

          MVK="$HOME/GeneralsX/MoltenVK/MoltenVK/MoltenVK"
          echo "VULKAN_SDK=$MVK" >> "$GITHUB_ENV"

          STATIC_LIB=$(find "$MVK" -type f \
            -name "libMoltenVK.a" -print -quit)

          if [ -z "$STATIC_LIB" ]; then
            echo "::error::Static MoltenVK not found"
            exit 1
          fi

          TARGET="$MVK/lib/MoltenVK.xcframework/ios-arm64"
          mkdir -p "$TARGET"

          if [ "$STATIC_LIB" != "$TARGET/libMoltenVK.a" ]; then
            cp "$STATIC_LIB" "$TARGET/libMoltenVK.a"
          fi

          test -s "$TARGET/libMoltenVK.a"
          echo "Static MoltenVK ready"

      - name: Configure iOS build
        run: |
          set -e
          cmake --preset ios-vulkan

      - name: Verify build dependencies
        run: |
          set -e
          command -v cmake
          command -v ninja
          command -v meson
          command -v glslangValidator
          command -v clang

      - name: Compile engine
        run: |
          set -e
          cmake --build build/ios-vulkan \
            --target z_generals --parallel 3

      - name: Package iOS libraries and IPA
        shell: bash
        run: |
          set -euo pipefail

          BUILD="build/ios-vulkan"
          APP="$BUILD/GeneralsMD/GeneralsXZH.app"
          DEST="output/Payload/GeneralsXZH.app"
          FRAMEWORKS="$DEST/Frameworks"

          echo "Checking application..."
          test -d "$APP"
          test -f "$APP/GeneralsXZH"

          mkdir -p output/Payload
          cp -R "$APP" "$DEST"
          mkdir -p "$FRAMEWORKS"

          echo "Finding libraries..."
          find "$BUILD/_deps" -type f \
            -name "*.dylib" -print

          copy_library() {
            local pattern="$1"
            local required="$2"
            local file
            local name

            file=$(find "$BUILD/_deps" \
              \( -type f -o -type l \) \
              -name "$pattern" -print -quit)

            if [ -z "$file" ]; then
              if [ "$required" = "yes" ]; then
                echo "::error::Missing library: $pattern"
                exit 1
              fi
              echo "::warning::Optional library missing: $pattern"
              return
            fi

            name=$(basename "$file")
            echo "Copying $file"
            cp -L "$file" "$FRAMEWORKS/$name"
          }

          copy_library "libSDL3.0*.dylib" yes
          copy_library "libSDL3_image.0*.dylib" yes
          copy_library "libopenal*.dylib" no
          copy_library "libdxvk_d3d9*.dylib" no
          copy_library "libdxvk_d3d8*.dylib" no

          echo "Creating SDL compatibility names..."

          SDL_IMAGE=$(find "$FRAMEWORKS" -maxdepth 1 \
            -type f -name "libSDL3_image.0*.dylib" \
            -print -quit)

          test -n "$SDL_IMAGE"

          if [ ! -f "$FRAMEWORKS/libSDL3_image.0.dylib" ]; then
            cp "$SDL_IMAGE" \
              "$FRAMEWORKS/libSDL3_image.0.dylib"
          fi

          SDL=$(find "$FRAMEWORKS" -maxdepth 1 \
            -type f -name "libSDL3.0*.dylib" \
            -print -quit)

          if [ ! -f "$FRAMEWORKS/libSDL3.0.dylib" ]; then
            cp "$SDL" "$FRAMEWORKS/libSDL3.0.dylib"
          fi

          echo "Fixing library identifiers..."

          for dylib in "$FRAMEWORKS/"*.dylib; do
            [ -f "$dylib" ] || continue

            name=$(basename "$dylib")

            install_name_tool -id \
              "@rpath/$name" "$dylib"
          done

          echo "Adding executable rpath..."

          if ! otool -l "$DEST/GeneralsXZH" |
            grep -q '@executable_path/Frameworks'; then
            install_name_tool -add_rpath \
              "@executable_path/Frameworks" \
              "$DEST/GeneralsXZH"
          fi

          echo "Fixing all bundled dependencies..."

          fix_dependencies() {
            local binary="$1"
            local dependency
            local name

            while IFS= read -r dependency; do
              name=$(basename "$dependency")

              if [ -f "$FRAMEWORKS/$name" ]; then
                if [ "$dependency" != "@rpath/$name" ]; then
                  install_name_tool -change \
                    "$dependency" \
                    "@rpath/$name" \
                    "$binary"
                fi
              fi
            done < <(
              otool -L "$binary" |
              awk 'NR>1 {print $1}'
            )
          }

          fix_dependencies "$DEST/GeneralsXZH"

          for dylib in "$FRAMEWORKS/"*.dylib; do
            [ -f "$dylib" ] || continue
            fix_dependencies "$dylib"
          done

          echo "Checking architecture and platform..."

          file "$DEST/GeneralsXZH"
          otool -L "$DEST/GeneralsXZH"

          for dylib in "$FRAMEWORKS/"*.dylib; do
            [ -f "$dylib" ] || continue
            echo "Checking $(basename "$dylib")"
            file "$dylib"
            otool -L "$dylib"
          done

          echo "Checking unresolved dependencies..."

          python3 - <<'PY'
          import os
          import subprocess
          import sys

          app = "output/Payload/GeneralsXZH.app"
          frameworks = os.path.join(app, "Frameworks")
          binaries = [os.path.join(app, "GeneralsXZH")]

          binaries += [
              os.path.join(frameworks, f)
              for f in os.listdir(frameworks)
              if f.endswith(".dylib")
          ]

          missing = []

          for binary in binaries:
              result = subprocess.run(
                  ["otool", "-L", binary],
                  capture_output=True,
                  text=True,
                  check=True
              )

              for line in result.stdout.splitlines()[1:]:
                  dep = line.strip().split(" ")[0]

                  if dep.startswith("@rpath/"):
                      name = os.path.basename(dep)
                      path = os.path.join(frameworks, name)

                      if not os.path.isfile(path):
                          missing.append((binary, dep))

          if missing:
              for binary, dep in missing:
                  print(f"::error::{binary}: missing {dep}")
              sys.exit(1)

          print("Bundled @rpath dependencies verified")
          PY

          echo "Removing old signatures..."

          codesign --remove-signature \
            "$DEST/GeneralsXZH" 2>/dev/null || true

          for dylib in "$FRAMEWORKS/"*.dylib; do
            [ -f "$dylib" ] || continue
            codesign --remove-signature \
              "$dylib" 2>/dev/null || true
          done

          echo "Creating unsigned IPA..."

          (
            cd output
            /usr/bin/zip -qry GeneralsXZH.ipa Payload
          )

          test -s output/GeneralsXZH.ipa
          ls -lh output/GeneralsXZH.ipa

          echo "IPA packaging completed"

      - name: Upload iPhone IPA
        uses: actions/upload-artifact@v4
        with:
          name: GeneralsXZH-iPhone-IPA
          path: output/GeneralsXZH.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Save compiled files
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: generals-ios-engine
          path: build/ios-vulkan/GeneralsMD/
          if-no-files-found: error
          retention-days: 7
